version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
env:
  variables:
    REACT_APP_API_URL: https://d0a6nhqiqd.execute-api.us-east-1.amazonaws.com/Prod
