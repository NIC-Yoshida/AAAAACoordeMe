AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  backend

  Sample SAM Template for backend

Globals:
  Function:
    Timeout: 10

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CoordeMeUsers
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: "*"
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get
        DatabaseView:
          Type: Api
          Properties:
            Path: /db
            Method: get
        AuthLogin:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post
        AuthLoginOptions:
          Type: Api
          Properties:
            Path: /auth/login
            Method: options

Outputs:
  ApiBaseUrl:
    Description: "API Gateway Base URL (Set this to REACT_APP_API_URL in Amplify)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
  HelloWorldApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  AuthApi:
    Description: "API Gateway endpoint URL for authentication"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/auth/login"
  UsersTableName:
    Description: "Users DynamoDB Table Name"
    Value: !Ref UsersTable
  HelloWorldFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt HelloWorldFunctionRole.Arn

